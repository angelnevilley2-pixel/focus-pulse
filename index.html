<body>
<title>Focus Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-width app shell (top bar, scrolling screen, bottom tabs) centred on desktop beside a notes rail; full-bleed on phones. Each tab carries its own accent. */
/* Palette (from the user's brand board): 80% obsidian base #0B0F19, 15% neuro-electric cyan #00F0FF for metrics and flow, 5% recovery violet #7C3AED for mental states. Dark-only by design. */
:root{
  --bg:#05070D; --app:#0B0F19; --surface:#111726; --surface-2:#182033; --track:#1E2740;
  --ink:#E8EEF8; --muted:#8C97AF; --line:#222C42;
  --brand:#00F0FF; --brand-ink:#001519; --brand-soft:rgba(0,240,255,.12);
  --violet:#7C3AED;
  --mental:#A78BFA; --mental-ink:#0B0F19; --mental-soft:rgba(124,58,237,.22);
  --food:#2DE1C2; --food-ink:#00140F; --food-soft:rgba(45,225,194,.12);
  --train:#4D8BFF; --train-ink:#00102B; --train-soft:rgba(77,139,255,.14);
  --water:#38BDF8; --water-soft:rgba(56,189,248,.13);
  --gold:#F5C04A; --gold-soft:rgba(245,192,74,.14); --warn-ink:#F5C04A;
  --danger:#FF6B7A; --danger-soft:rgba(255,107,122,.14);
  --hero:#0E1424; --hero-2:#1A2338; --hero-fg:#E8EEF8; --hero-muted:#8C97AF;
  --brand-bright:#00F0FF; --on-bright:#001519; --on-gold:#2A1E00;
  --mascot:#00F0FF; --mascot-ink:#0B0F19; --knob:#E8EEF8; --face:var(--mental-soft);
  --glow:0 0 18px rgba(0,240,255,.45); --glow-v:0 0 18px rgba(124,58,237,.5);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.55),0 0 0 1px rgba(0,240,255,.04);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}

html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--acc,var(--brand));outline-offset:2px}
.ic{display:block;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:12.5px}
p{margin:0}

.stage{height:100%;display:flex;justify-content:center;align-items:center;gap:56px}
.phone{position:relative;width:100%;max-width:440px;height:100%;background:var(--app);display:flex;flex-direction:column;overflow:hidden;overflow:clip}
@media (min-width:720px){.stage{padding:24px}.phone{max-height:920px;border-radius:38px;border:1px solid var(--line);box-shadow:var(--shadow)}}
.rail{display:none;max-width:310px;min-width:0}
@media (min-width:1060px){.rail{display:block}}
.rail .eyebrow{color:var(--brand)}
.rail h2{font:800 44px/1 var(--f-display);letter-spacing:-.03em;margin:10px 0 14px}
.rail > p{color:var(--muted);font-size:15.5px;max-width:34ch}
.about h3{font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 10px}
.about ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;font-size:14.5px}
.about li{display:flex;gap:9px;align-items:flex-start}
.about li .ic{color:var(--brand);margin-top:2px}
.about li.sim .ic{color:var(--gold)}
.about .fine{font-size:13px;color:var(--muted);margin-top:18px}

/* top bar + tabs */
.topbar{display:flex;align-items:center;gap:8px;padding:12px 16px 8px}
.brandmark{display:flex;align-items:center;gap:8px;font:700 17px var(--f-display);letter-spacing:-.01em}
.proto{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:2px 7px;border-radius:99px}
.spacer{flex:1}
.xp{display:flex;align-items:center;gap:6px;background:var(--gold-soft);border-radius:99px;padding:3px 10px 3px 3px;font-weight:700;font-size:12.5px;border:0}
.xp .lv{background:var(--gold);color:var(--on-gold);border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;font-size:12px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink);flex:none}
.tpill{display:inline-flex;align-items:center;gap:5px;background:var(--hero);color:var(--hero-fg);border-radius:99px;padding:5px 10px;font:700 12.5px var(--f-body);font-variant-numeric:tabular-nums;border:0}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.screen{padding:4px 16px 32px;display:flex;flex-direction:column;gap:20px}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 6px 8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600}
.tab .tp{width:48px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
.tab[aria-current="page"]{color:var(--tc)}
.tab[aria-current="page"] .tp{background:var(--ts)}
.tab[data-tab="inicio"],#s-inicio,#s-perfil,.tab[data-tab="perfil"]{--tc:var(--brand);--ts:var(--brand-soft);--acc:var(--brand);--acc-soft:var(--brand-soft);--acc-ink:var(--brand-ink)}
.tab[data-tab="mental"],#s-mental{--tc:var(--mental);--ts:var(--mental-soft);--acc:var(--mental);--acc-soft:var(--mental-soft);--acc-ink:var(--mental-ink)}
.tab[data-tab="nutricion"],#s-nutricion{--tc:var(--food);--ts:var(--food-soft);--acc:var(--food);--acc-soft:var(--food-soft);--acc-ink:var(--food-ink)}
.tab[data-tab="entreno"],#s-entreno{--tc:var(--train);--ts:var(--train-soft);--acc:var(--train);--acc-soft:var(--train-soft);--acc-ink:var(--train-ink)}

/* type + shared bits */
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.h1{font:700 29px/1.08 var(--f-display);letter-spacing:-.025em;margin:2px 0 0;text-wrap:balance}
.h2{font:700 19px/1.2 var(--f-display);letter-spacing:-.01em;margin:0}
.screen-head .eyebrow{color:var(--acc)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;border:0;font:700 15px/1 var(--f-body);background:var(--acc,var(--brand));color:var(--acc-ink,var(--brand-ink))}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.small{height:36px;padding:0 13px;font-size:13.5px;border-radius:11px}
.btn.full{width:100%}
.link{background:none;border:0;padding:4px 0;color:var(--acc,var(--brand));font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.link.danger{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:var(--surface-2);font-size:12.5px;font-weight:600}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;width:max-content}
.pill.ok{background:var(--brand-soft);color:var(--brand)} .pill.warn{background:var(--gold-soft);color:var(--warn-ink)} .pill.bad{background:var(--danger-soft);color:var(--danger)}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc,var(--brand));border-radius:99px;transition:width .4s}
.bar.gold i{background:var(--gold)}
.ring{position:relative;flex:none}
.ring svg{display:block}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.ring-c b{font:700 17px var(--f-display);font-variant-numeric:tabular-nums}
.ring-c small{font-size:10.5px;color:var(--muted);font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.label{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:10px 12px;font:500 15px/1.3 var(--f-body)}
.field textarea{resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:1em}
.switch{width:46px;height:28px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none;transition:background .2s;padding:0}
.switch span{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"] span{transform:translateX(18px)}
.row-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--ink)}
.row-btn > span{flex:1;min-width:0}
.row-btn small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.ico{width:42px;height:42px;border-radius:14px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none}

/* inicio */
.hello{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:4px}
.hello .mascot{margin:2px -8px -18px 0;flex:none}
.hello > div{min-width:0}
.today{display:flex;gap:16px;align-items:center}
.today-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.today-title{font:700 17px var(--f-display)}
.lv-row{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.streak{display:inline-flex;align-items:center;gap:3px;color:var(--train);font-weight:700}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mstat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.mstat span{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--muted)}
.mstat b{font:700 17px var(--f-display);display:block;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.focus{background:var(--hero);color:var(--hero-fg);border-radius:28px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:14px}
.focus-head{display:flex;justify-content:space-between;align-items:center}
.focus .eyebrow{color:var(--hero-muted)}
.icon-btn.hero{background:var(--hero-2);border-color:transparent;color:var(--hero-fg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--hero-2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;color:var(--hero-muted);font:700 13px var(--f-body);height:34px;border-radius:10px}
.seg button[aria-selected="true"]{background:var(--hero-fg);color:var(--hero)}
.pomo-ring{position:relative;width:220px;max-width:100%;aspect-ratio:1;margin:0 auto}
.pomo-ring svg{width:100%;height:100%;display:block}
.pomo-ring .trk{fill:none;stroke:var(--hero-2);stroke-width:10}
.pomo-ring .prg{fill:none;stroke:var(--brand-bright);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.pomo-ring .prg.short,.pomo-ring .prg.long{stroke:var(--gold)}
.pomo-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.pomo-time{font:700 54px/1 var(--f-body);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pomo-label{font-size:13px;color:var(--hero-muted);font-weight:700}
.pomo-dots{display:flex;gap:6px;margin-top:6px}
.pomo-dots i{width:8px;height:8px;border-radius:50%;background:var(--hero-2)}
.pomo-dots i.on{background:var(--brand-bright)}
.pomo-ctrl{display:flex;justify-content:center;align-items:center;gap:20px}
.round{width:52px;height:52px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--hero-2);color:var(--hero-fg)}
.round.main{width:70px;height:70px;background:var(--brand-bright);color:var(--on-bright)}
.pomo-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--hero-muted);flex-wrap:wrap}
.link.on-hero{color:var(--brand-bright);font-size:13px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:2px 14px}
.habit{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:0}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--cat);display:grid;place-items:center;background:transparent;color:var(--app);flex:none;transition:transform .15s,background .2s;padding:0}
.check svg{opacity:0}
.habit.done .check{background:var(--cat)}
.habit.done .check svg{opacity:1}
.habit.missed .check{border-style:dashed;border-color:var(--muted);color:var(--muted)}
.habit.missed .check svg{opacity:1}
.check.pop{animation:pop .4s ease}
@keyframes pop{45%{transform:scale(1.25)}}
.h-body{flex:1;min-width:0}
.h-name{font-weight:600;font-size:15px}
.habit.done .h-name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.h-meta{margin-top:2px;font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.cat-tag{color:var(--cat);font-weight:700}
.reason{background:var(--surface-2);border-radius:99px;padding:1px 8px;font-weight:700}
.more{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}
.rem{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.rem p{flex:1;min-width:0;font-size:14.5px;font-weight:500}
.time-pill{font:700 13px var(--f-body);font-variant-numeric:tabular-nums;background:var(--surface-2);border-radius:10px;padding:5px 8px;flex:none}
.rem .dv{display:flex;gap:4px;color:var(--muted)}
.list-foot{padding:12px 0}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.goal + .goal{margin-top:8px}
.goal-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.goal-top{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;font-weight:600}
.goal-top span{color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.goal .bar i{background:var(--cat)}
.plus{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;flex:none}

/* mental */
.quote{display:flex;gap:10px;align-items:flex-end}
.quote .mascot{flex:none}
.bubble{background:var(--mental-soft);border-radius:22px 22px 22px 6px;padding:14px 16px;flex:1;min-width:0}
.quote-txt{font:600 17.5px/1.35 var(--f-display);margin-bottom:6px;text-wrap:pretty}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:8px 0 16px}
.mood{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:14px;border:1.5px solid transparent;background:var(--surface-2);font-size:11px;font-weight:700;color:var(--muted)}
.mood.on{border-color:var(--mental);background:var(--mental-soft);color:var(--ink)}
.range{margin-bottom:12px}
.range-top{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.range-top output{font-variant-numeric:tabular-nums;color:var(--acc)}
.range input{width:100%;accent-color:var(--acc);margin:6px 0 0}
.range-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.ck-sum{display:flex;gap:12px;align-items:center;margin-bottom:12px;color:var(--mental)}
.ck-sum b{color:var(--ink);font:700 18px var(--f-display)}
.nudge{display:flex;flex-direction:column;gap:10px;background:var(--mental-soft);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:14px}
.meter{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--brand) 0 40%,var(--gold) 40% 65%,var(--danger) 65% 100%);margin:16px 0 8px}
.meter i{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.meter-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:600}
.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 10px 8px;min-width:0}
.mini-top{font-size:12px;color:var(--muted);font-weight:700}
.mini-top b{display:block;font:700 17px var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;height:74px;margin-top:8px}
.bcol{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.bw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.b{width:100%;max-width:11px;border-radius:4px 4px 2px 2px;background:var(--c);opacity:.5}
.b.today{opacity:1}
.b.empty{background:none;border:1.5px dashed var(--line);opacity:1}
.bcol span{font-size:10px;color:var(--muted);font-weight:600}
.rrow{display:grid;grid-template-columns:112px minmax(0,1fr) 20px;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.rbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.rbar i{display:block;height:100%;background:var(--mental);border-radius:99px}
.rrow b{text-align:right;font-variant-numeric:tabular-nums}
.tip{display:flex;gap:10px;background:var(--mental-soft);border-radius:14px;padding:12px;margin-top:12px;font-size:14px}
.tip .ic{color:var(--mental);margin-top:2px}
.chat-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;padding:2px}
.msg{max-width:86%;padding:10px 13px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--mental);color:var(--mental-ink);border-radius:18px 18px 6px 18px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border-radius:18px 18px 18px 6px}
.msg.ai.pending{color:var(--muted);font-style:italic}
.msg .tag{display:block;font-size:11px;color:var(--muted);font-style:normal;margin-top:4px}
.crisis{background:var(--danger-soft);border-radius:16px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.crisis b{color:var(--danger)}
.starters{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font:600 13px var(--f-body);color:var(--ink)}
.chat-form{display:flex;gap:8px}
.chat-form input{flex:1;min-width:0;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 14px;font:500 15px var(--f-body)}
.send{width:46px;height:46px;border-radius:14px;border:0;background:var(--mental);color:var(--mental-ink);display:grid;place-items:center;flex:none}
.ai-note{font-size:12px;color:var(--muted);margin-top:8px}
.crisis-foot{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted)}
.breath{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 16px}
.breath-circle{width:190px;height:190px;border-radius:50%;margin:14px auto;background:radial-gradient(circle,var(--mental-soft) 0 30%,var(--mental) 100%);transform:scale(.55);transition:transform 4s ease-in-out}
.breath-circle.in{transform:scale(1)}
.breath-label{font:700 24px var(--f-display)}

/* nutrición */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.stat .k{font-size:12px;font-weight:700;color:var(--muted)}
.stat .v{font:700 25px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.stat .v small{font:700 13px var(--f-body);color:var(--muted)}
.stat p{font-size:12px;color:var(--muted)}
.macro-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;margin:12px 0}
.macro-bar i{display:block}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.legend b{display:block;font:700 17px var(--f-display);color:var(--ink)}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.mp{background:var(--train)} .mc{background:var(--gold)} .mg{background:var(--food)}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px}
.meal + .meal{margin-top:10px}
.meal-head{display:flex;gap:12px;align-items:center}
.plate{width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--train) 0 var(--pp),var(--gold) 0 var(--pc),var(--food) 0 100%);position:relative;flex:none}
.plate::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--surface)}
.meal-title{flex:1;min-width:0}
.meal-title h3{margin:0;font:700 17px var(--f-display)}
.eat{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:6px 10px;font:700 12.5px var(--f-body);color:var(--ink);flex:none}
.eat.on{background:var(--food);border-color:var(--food);color:var(--food-ink)}
.items{list-style:none;margin:0;padding:0}
.items li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.items li > div{flex:1;min-width:0;display:flex;flex-direction:column}
.items b{font-weight:600;font-size:14.5px}
.items .muted{font-size:12.5px}
.swap{display:inline-flex;align-items:center;gap:4px;border:0;background:var(--food-soft);color:var(--food);border-radius:10px;padding:6px 9px;font:700 12px var(--f-body);flex:none}
.water{display:flex;gap:6px;flex-wrap:wrap}
.drop{width:36px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;padding:0}
.drop.on{background:var(--water-soft);border-color:var(--water);color:var(--water)}

/* entreno */
.steps-card{display:flex;gap:16px;align-items:center}
.steps-card > div:last-child{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.walk-opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.walk-time{font:700 42px/1 var(--f-body);font-variant-numeric:tabular-nums}
.walk-run{display:flex;flex-direction:column;gap:12px}
.walk-btns{display:flex;gap:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ex + .ex{margin-top:10px}
.ex.done{border-color:var(--train)}
.ex-top{display:flex;gap:12px;align-items:center}
.ex-info{flex:1;min-width:0}
.ex-info h3{margin:0;font:700 16px var(--f-display)}
.ex-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sets{display:flex;gap:6px}
.set{width:42px;height:36px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font:700 14px var(--f-body)}
.set.on{background:var(--train);border-color:var(--train);color:var(--train-ink)}
.kg{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.kg input{width:64px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);text-align:center;font:700 14px var(--f-body)}
.rest{display:flex;align-items:center;gap:10px;background:var(--train-soft);color:var(--ink);border-radius:14px;padding:10px 14px;margin-bottom:10px;font-weight:700}
.rest b{font-variant-numeric:tabular-nums;margin-left:auto;font-size:17px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:14px;text-align:center;background:var(--surface);border:1px solid var(--line);min-width:0}
.wd span{font-size:11px;color:var(--muted);font-weight:700}
.wd b{font:700 15px var(--f-display)}
.wd small{font-size:9.5px;color:var(--muted);line-height:1.15;overflow-wrap:anywhere;font-weight:600}
.wd .st{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--train-soft);color:var(--train)}
.wd.past .st{background:var(--train);color:var(--train-ink)}
.wd.today{background:var(--train);border-color:var(--train);color:var(--train-ink)}
.wd.today span,.wd.today small{color:inherit}
.wd.today .st{background:var(--train-ink);color:var(--train)}

/* perfil */
.profile-head{display:flex;gap:14px;align-items:center}
.profile-head > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.name-in{font:700 23px var(--f-display);border:0;border-bottom:1.5px dashed var(--line);background:transparent;color:var(--ink);padding:0 0 2px;width:100%}
.plan-chip{align-self:flex-start;font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--surface-2);white-space:nowrap}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11.5px;font-weight:700;background:none;border:0;color:var(--ink);padding:0;min-width:0}
.medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--warn-ink);border:2px solid var(--gold)}
.badge.locked{color:var(--muted)}
.badge.locked .medal{background:var(--surface-2);color:var(--muted);border:2px dashed var(--line)}
.dev,.set-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.dev > div,.set-row > div{flex:1;min-width:0}
.dev b,.set-row b{font-weight:600;display:block}
.dev-logo{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font:800 15px var(--f-display);flex:none}
.bio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.bio div{background:var(--surface-2);border-radius:14px;padding:10px}
.bio span{font-size:11px;color:var(--muted);font-weight:700;display:block}
.bio b{font:700 15px var(--f-display);font-variant-numeric:tabular-nums}
.coach-form{display:flex;gap:8px;margin-top:12px}
.coach-form input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 12px;font:600 15px var(--f-body);text-transform:uppercase}
.coach-on{display:flex;gap:12px;align-items:center;background:var(--brand-soft);border-radius:16px;padding:12px;margin:12px 0 4px}
.coach-on .ic{color:var(--brand)}
.confirm{background:var(--danger-soft);border-radius:14px;padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.confirm .btns{display:flex;gap:8px}
.btn.danger{background:var(--danger);color:var(--surface)}

/* overlays */
.notif{position:absolute;left:10px;right:10px;top:10px;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:12px 14px;transform:translateY(-150%);transition:transform .4s cubic-bezier(.2,.9,.3,1.15)}
.notif.show{transform:none}
.notif-top{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.notif-top b{color:var(--ink)}
.notif-top button{margin-left:auto;border:0;background:none;color:var(--muted);padding:2px}
.notif h4{margin:7px 0 2px;font-size:15.5px}
.notif-actions{display:flex;gap:8px;margin-top:10px}
.notif-watch{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:9px}
.toast{position:absolute;left:50%;bottom:86px;transform:translate(-50%,16px);background:var(--ink);color:var(--app);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;z-index:65;width:max-content;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.backdrop{position:absolute;inset:0;background:rgba(5,10,8,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:var(--app);border-radius:26px 26px 0 0;padding:10px 18px 22px;max-height:88%;overflow:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:12px}
.sheet.show{transform:none}
.grabber{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px;flex:none}
.reason-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.reason-btn{height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font:700 14px var(--f-body);color:var(--ink)}
.celeb{position:absolute;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgba(5,10,8,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.celeb.show{opacity:1;pointer-events:auto}
.celeb-card{background:var(--surface);border-radius:30px;padding:26px 22px 20px;text-align:center;max-width:320px;width:100%;transform:scale(.85);transition:transform .4s cubic-bezier(.2,.9,.3,1.4);display:flex;flex-direction:column;align-items:center;gap:8px}
.celeb.show .celeb-card{transform:none}
.celeb-card h2{font:800 26px/1.1 var(--f-display);margin:4px 0 0;letter-spacing:-.02em;text-wrap:balance}
.celeb-card p{color:var(--muted);margin-bottom:10px}
.mascot{overflow:visible;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mascot g,.mascot ellipse.m-shadow{transform-box:view-box}
.m-body,.m-head,.m-arm-l,.m-arm-r,.m-shadow,.m-brows,.m-mouth{animation-delay:var(--d,0s)}
.m-body{transform-origin:50px 94px;animation:m-live 8s cubic-bezier(.45,0,.35,1) infinite}
.m-head{transform-origin:50px 76px;animation:m-head 8s ease-in-out infinite}
.m-arm-l{transform-origin:23px 46px;animation:m-arml 8s ease-in-out infinite}
.m-arm-r{transform-origin:77px 46px;animation:m-armr 8s ease-in-out infinite}
.m-shadow{transform-origin:50px 95.5px;animation:m-shade 8s cubic-bezier(.45,0,.35,1) infinite}
.m-brows{transform-origin:50px 41px;animation:m-brows 8s ease-in-out infinite}
.m-mouth{transform-origin:50px 64px;animation:m-mouth 8s ease-in-out infinite}
.m-eyes{transform-origin:50px 53px;animation:m-blink 4.6s infinite}
.m-look{transform:translate(var(--lx,0px),var(--ly,0px));transition:transform .25s ease-out}
.m-calm .m-body{animation:m-breathe 5.5s ease-in-out infinite}
.m-calm .m-shadow{animation:m-shadow 5.5s ease-in-out infinite}
.m-calm .m-head{animation:m-sway 9s ease-in-out infinite}
.m-calm .m-arm-l,.m-calm .m-arm-r{animation:m-press 5.5s ease-in-out infinite}
.m-calm .m-brows,.m-calm .m-mouth{animation:none}
.m-celebrate .m-body,.mascot.cheer .m-body{animation:m-hop .62s cubic-bezier(.3,.7,.4,1) infinite}
.m-celebrate .m-shadow,.mascot.cheer .m-shadow{animation:m-hopshadow .62s cubic-bezier(.3,.7,.4,1) infinite}
.m-celebrate .m-arm-l,.m-celebrate .m-arm-r,.mascot.cheer .m-arm-l,.mascot.cheer .m-arm-r{animation:m-pump .31s ease-in-out infinite}
.m-celebrate .m-head,.mascot.cheer .m-head{animation:m-wiggle .62s ease-in-out infinite}
.m-celebrate .m-brows,.mascot.cheer .m-brows{animation:none;transform:translateY(-2px)}
.mascot.poke .m-body{animation:m-poke .7s cubic-bezier(.3,1.6,.5,1)}
.mascot.poke .m-arm-l,.mascot.poke .m-arm-r{animation:m-pump .35s ease-in-out 2}
@keyframes m-live{0%,100%{transform:none}8%,24%{transform:scale(1.02,.98)}16%,32%{transform:none}
  40%,56%{transform:translateY(1px) scale(1.06,.93)}48%,64%{transform:translateY(-2px) scale(.97,1.04)}
  70%{transform:translateY(1px) scale(1.08,.9)}76%{transform:translateY(-13px) scale(.95,1.07)}82%{transform:translateY(0) scale(1.08,.92)}88%{transform:scale(.98,1.02)}92%{transform:none}}
@keyframes m-shade{0%,100%,92%{transform:none;opacity:1}40%,56%,70%{transform:scale(1.08)}76%{transform:scale(.62);opacity:.45}82%{transform:scale(1.1)}}
@keyframes m-arml{0%,16%,32%,72%,100%{transform:none}8%,24%{transform:translateY(6px) rotate(7deg)}40%,56%{transform:translateY(8px) rotate(5deg)}48%,64%{transform:translateY(-6px) rotate(-5deg)}76%{transform:translateY(-4px) rotate(-14deg)}84%{transform:none}}
@keyframes m-armr{0%,8%,24%,72%,100%{transform:none}4%{transform:none}16%,32%{transform:translateY(6px) rotate(-7deg)}40%,56%{transform:translateY(8px) rotate(-5deg)}48%,64%{transform:translateY(-6px) rotate(5deg)}76%{transform:translateY(-4px) rotate(14deg)}84%{transform:none}}
@keyframes m-head{0%,100%{transform:none}12%{transform:rotate(3deg)}28%{transform:rotate(-3deg)}40%,56%{transform:translateY(1.5px)}48%,64%{transform:translateY(-1px)}76%{transform:rotate(-4deg)}86%{transform:rotate(5deg) translateX(1px)}94%{transform:rotate(-2deg)}}
@keyframes m-brows{0%,36%,100%{transform:none}44%,60%{transform:translateY(1.2px)}74%,84%{transform:translateY(-2.6px)}90%{transform:none}}
@keyframes m-mouth{0%,68%,100%{transform:none}74%,82%{transform:scale(1.15,1.3)}90%{transform:none}}
@keyframes m-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975) translateY(.6px)}}
@keyframes m-sway{0%,100%{transform:rotate(0)}30%{transform:rotate(2.2deg)}70%{transform:rotate(-2.2deg)}}
@keyframes m-press{0%,100%{transform:translateY(0) rotate(0)}45%,55%{transform:translateY(6px) rotate(4deg)}}
@keyframes m-pump{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes m-wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes m-blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@keyframes m-shadow{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes m-hop{0%,100%{transform:translateY(0) scale(1.06,.94)}15%{transform:translateY(0) scale(.96,1.05)}50%{transform:translateY(-14px) scale(1)}}
@keyframes m-hopshadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.65);opacity:.45}}
@keyframes m-poke{0%{transform:scale(1)}20%{transform:scale(1.12,.86)}45%{transform:translateY(-14px) scale(.94,1.08) rotate(-6deg)}70%{transform:translateY(0) scale(1.05,.95)}100%{transform:none}}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px) scale(1.03)}}
.mascot{filter:drop-shadow(0 6px 10px rgba(0,0,0,.4)) drop-shadow(0 0 14px rgba(124,58,237,.45)) drop-shadow(0 0 6px rgba(0,240,255,.25))}
@keyframes hop{50%{transform:translateY(-10px)}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.fxp{position:absolute;z-index:71;font:800 16px var(--f-display);color:var(--gold);pointer-events:none;animation:fxp 1.1s ease-out forwards;white-space:nowrap}
@keyframes fxp{from{opacity:0;transform:translate(-50%,-50%)}15%{opacity:1}to{opacity:0;transform:translate(-50%,-190%)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* neon finish */
body{background:radial-gradient(ellipse at 70% 10%,rgba(124,58,237,.10),transparent 55%),radial-gradient(ellipse at 20% 90%,rgba(0,240,255,.06),transparent 50%),var(--bg)}
.focus{background:linear-gradient(160deg,#101830,#0B0F19);border:1px solid rgba(0,240,255,.18);box-shadow:inset 0 0 40px rgba(0,240,255,.05)}
.pomo-ring .prg{filter:drop-shadow(0 0 6px rgba(0,240,255,.7))}
.round.main,.pomo-dots i.on{box-shadow:var(--glow)}
.btn:not(.ghost){box-shadow:0 0 14px color-mix(in srgb,var(--acc,var(--brand)) 40%,transparent)}
#s-mental .btn:not(.ghost){background:var(--violet);color:#fff;box-shadow:var(--glow-v)}
.bar i{box-shadow:0 0 8px color-mix(in srgb,var(--acc,var(--brand)) 60%,transparent)}
.ring svg circle:last-child{filter:drop-shadow(0 0 4px currentColor)}
.tab[aria-current="page"] .tp{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tc) 45%,transparent)}
.habit.done .check{box-shadow:0 0 10px color-mix(in srgb,var(--cat) 55%,transparent)}
.card{background:linear-gradient(180deg,#121A2B,#0F1523)}
.celeb-card{border:1px solid rgba(0,240,255,.25);box-shadow:var(--glow)}
.xp{border:1px solid rgba(245,192,74,.25)}
.plans{display:flex;flex-direction:column;gap:10px}
.plan{position:relative;border:1px solid var(--line);border-radius:20px;padding:16px;background:var(--surface-2)}
.plan.pop{border-color:rgba(0,240,255,.55);box-shadow:0 0 22px rgba(0,240,255,.18)}
.plan.coach{border-color:rgba(124,58,237,.6);box-shadow:0 0 22px rgba(124,58,237,.2)}
.plan.cur{outline:2px solid var(--brand);outline-offset:-2px}
.plan-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.plan h3{margin:0;font:700 17px var(--f-display)}
.plan .price{font:800 28px/1 var(--f-display);letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.plan .price small{font:600 13px var(--f-body);color:var(--muted);margin-left:4px;letter-spacing:0}
.plan ul{list-style:none;margin:12px 0 14px;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.plan li{display:flex;gap:8px;align-items:flex-start}
.plan li .ic{color:var(--brand);margin-top:1px}
.plan.coach li .ic{color:var(--mental)}
.plan.coach .btn{background:var(--violet);color:#fff;box-shadow:var(--glow-v)}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:var(--brand);color:var(--brand-ink);white-space:nowrap}
.plan.coach .tag{background:var(--violet);color:#fff}
.plan-chip.pro{background:var(--brand-soft);color:var(--brand)} .plan-chip.coach{background:var(--mental-soft);color:var(--mental)}
.task{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.task p{flex:1;min-width:0;font-weight:600}
.tcheck{width:28px;height:28px;border-radius:9px;border:2px solid var(--brand);background:transparent;color:var(--app);display:grid;place-items:center;padding:0;flex:none;transition:background .2s,transform .15s}
.tcheck .ic{opacity:0;transition:opacity .2s}
.task.done .tcheck{background:var(--brand);box-shadow:var(--glow)}.task.done .tcheck .ic{opacity:1}
.task.done p{color:var(--muted);text-decoration:line-through}

function mascot(mood = 'happy', size = 56) {
  /* Pulso, pseudo-3D: every lobe gets its own radial gradient (lit from top-left), so the brain reads as a bumpy volume.
     Parts live in groups the CSS animates: body breathes, arms press the dumbbells, eyes blink and follow the pointer. */
  const ink = '#140A33', lobes = [[33,38,12],[46,31,13],[60,31,13],[71,40,11],[75,53,10],[65,64,11],[50,66,12],[34,63,11],[25,51,11],[50,48,19]];
  const lob = (w, fill) => lobes.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r + w}" fill="${fill}"/>`).join('');
  const arm = side => {
    const L = side === 'l', x = L ? 3.5 : 68.5, hx = L ? 17.5 : 82.5;
    const path = L ? 'M23 46Q14 34 17.5 17' : 'M77 46Q86 34 82.5 17';
    return `<g class="m-arm m-arm-${side}">
      <path d="${path}" stroke="${ink}" stroke-width="6" fill="none" stroke-linecap="round"/><path d="${path}" stroke="url(#mp-limb)" stroke-width="3.8" fill="none" stroke-linecap="round"/>
      <rect x="${x}" y="13" width="28" height="4" rx="2" fill="url(#mp-bar)" stroke="${ink}" stroke-width="1.2"/>
      <rect x="${x + 0.5}" y="5.5" width="7" height="19" rx="2.8" fill="url(#mp-bell)" stroke="${ink}" stroke-width="1.2"/><rect x="${x + 20.5}" y="5.5" width="7" height="19" rx="2.8" fill="url(#mp-bell)" stroke="${ink}" stroke-width="1.2"/>
      <rect x="${x + 2}" y="7.5" width="1.8" height="12" rx=".9" fill="#fff" opacity=".7"/><rect x="${x + 22}" y="7.5" width="1.8" height="12" rx=".9" fill="#fff" opacity=".7"/>
      <circle cx="${hx}" cy="15" r="3.6" fill="url(#mp-lobe)" stroke="${ink}" stroke-width="1.2"/></g>`;
  };
  let eyes, mouth;
  if (mood === 'celebrate') {
    eyes = `<path d="M37 54q3-4.5 6 0M57 54q3-4.5 6 0" stroke="${ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    mouth = `<path d="M42 62.5q8 11 16 0z" fill="${ink}"/><path d="M45.5 67q4.5 3 9 0q-4.5-2.5-9 0z" fill="#F0ABFC"/>`;
  } else if (mood === 'calm') {
    eyes = `<path d="M37 52.5q3 3 6 0M57 52.5q3 3 6 0" stroke="${ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    mouth = `<path d="M44.5 63.5q5.5 4.5 11 0" stroke="${ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  } else {
    eyes = `<g class="m-look"><ellipse cx="40" cy="53" rx="2.8" ry="3.5" fill="${ink}"/><ellipse cx="60" cy="53" rx="2.8" ry="3.5" fill="${ink}"/><circle cx="41.1" cy="51.6" r="1.1" fill="#fff"/><circle cx="61.1" cy="51.6" r="1.1" fill="#fff"/></g>`;
    mouth = `<path d="M43.5 62.5q6.5 8.5 13 0z" fill="${ink}"/><path d="M46.5 66.2q3.5 2.4 7 0q-3.5-2-7 0z" fill="#F0ABFC"/>`;
  }
  return `<svg class="mascot m-${mood}" style="--d:-${(Math.random() * 8).toFixed(2)}s" viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="Pulso">
    <ellipse class="m-shadow" cx="50" cy="95.5" rx="20" ry="3.2" fill="url(#mp-shadow)"/>
    <g class="m-body">
      <g class="m-legs"><path d="M44 76v10M56 76v10" stroke="${ink}" stroke-width="6" stroke-linecap="round"/><path d="M44 76v10M56 76v10" stroke="url(#mp-leg)" stroke-width="3.8" stroke-linecap="round"/>
      <path d="M37.5 92.5q0-6 6.5-6h3q2 0 2 3v3.5zM62.5 92.5q0-6-6.5-6h-3q-2 0-2 3v3.5z" fill="url(#mp-shoe)" stroke="${ink}" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M38 92.3h11M51 92.3h11" stroke="#00D4E8" stroke-width="1.6" stroke-linecap="round"/></g>
      ${arm('l')}${arm('r')}
      <g class="m-head">
        ${lob(1.6, ink)}${lob(0, 'url(#mp-lobe)')}
        <path d="M50 20v14M38 27q5 4 1 10M62 27q-5 4-1 10M27 46q6 0 7 6M73 46q-6 0-7 6M30 66q5-4 10-1M70 66q-5-4-10-1M50 70v6" stroke="#2E1065" stroke-width="2" fill="none" stroke-linecap="round" opacity=".55"/>
        <path d="M50.8 20.5v13M38.8 27.5q4.5 4 .8 9.5M62.8 27.5q-4 4-.2 9.5" stroke="#7DF3FF" stroke-width="1.1" fill="none" stroke-linecap="round" opacity=".75"/>
        <ellipse cx="40" cy="25" rx="9" ry="4.2" fill="#fff" opacity=".42" transform="rotate(-18 40 25)"/>
        <ellipse cx="30" cy="60" rx="3.8" ry="2.3" fill="#E879F9" opacity=".55"/><ellipse cx="70" cy="60" rx="3.8" ry="2.3" fill="#E879F9" opacity=".55"/>
        <g class="m-eyes">${eyes}</g>
        <circle cx="40" cy="53" r="8.2" fill="url(#mp-lens)" stroke="#00F0FF" stroke-width="2.3"/><circle cx="60" cy="53" r="8.2" fill="url(#mp-lens)" stroke="#00F0FF" stroke-width="2.3"/>
        <path d="M35.5 49q2.5-2.6 5.5-2.4M55.5 49q2.5-2.6 5.5-2.4" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".85"/>
        <path d="M48.2 52.5q1.8-2 3.6 0M31.8 52l-6-2M68.2 52l6-2" stroke="#00F0FF" stroke-width="2.3" fill="none" stroke-linecap="round"/>
        <g class="m-brows"><path d="M33.5 41.5q5-3.4 10.5-1M56 40.5q5.5-2.4 10.5 1" stroke="${ink}" stroke-width="2.2" fill="none" stroke-linecap="round"/></g>
        <g class="m-mouth">${mouth}</g>
        <g class="m-closed"><path d="M36.5 53.5q3.5 2.6 7 0M56.5 53.5q3.5 2.6 7 0" stroke="${ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>
        <g class="m-sad"><path d="M44 66.5q6-5.5 12 0" stroke="${ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>
        <g class="m-zzz" fill="#00F0FF" font-family="Bricolage Grotesque, sans-serif" font-weight="800"><text x="76" y="24" font-size="9">z</text><text x="84" y="14" font-size="12">Z</text></g>
      </g>
    </g></svg>`;
}

}
function ring(p, size, color, label, sub, stroke = 8) {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r, c = size / 2;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(1,Math.max(0,p)))}" transform="rotate(-90 ${c} ${c})"/></svg><div class="ring-c"><b>${label}</b>${sub?`<small>${sub}</small>`:''}</div></div>`;
}

let sw0 = null, swallow = false;

let lookIdle = 0, lookRaf = 0;
function lookAt(x, y) {
  document.querySelectorAll('.mascot').forEach(m => {
    const r = m.getBoundingClientRect(); if (!r.width) return;
    const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height * .53), d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 220) * 1.8;
    m.style.setProperty('--lx', (dx / d * k).toFixed(2) + 'px'); m.style.setProperty('--ly', (dy / d * k).toFixed(2) + 'px');
  });
}
if (!RM) {
  document.addEventListener('pointermove', e => { lookIdle = Date.now(); cancelAnimationFrame(lookRaf); lookRaf = requestAnimationFrame(() => lookAt(e.clientX, e.clientY)); });
  setInterval(() => { if (Date.now() - lookIdle < 3000) return; document.querySelectorAll('.mascot').forEach(m => {
    const a = Math.random() * Math.PI * 2, k = Math.random() < .35 ? 0 : 1.6;
    m.style.setProperty('--lx', (Math.cos(a) * k).toFixed(2) + 'px'); m.style.setProperty('--ly', (Math.sin(a) * k * .7).toFixed(2) + 'px'); }); }, 2200);
}

'Gracias por decírmelo. Lo que sientes importa y no tienes que pasarlo sin ayuda. Por favor llama ahora al 911 o, en México, a la Línea de la Vida 800 911 2000. ¿Hay alguien de confianza que pueda estar contigo ahora?':'Thank you for telling me. What you feel matters and you don’t have to go through it alone. Please call 911 now or, in Mexico, Línea de la Vida at 800 911 2000. Is there someone you trust who can be with you right now?',
'Gracias por contármelo. El estrés suele aparecer cuando sentimos que hay más cosas que tiempo. Hagamos algo pequeño: 1 minuto de respiración y luego eliges una sola tarea para un pomodoro de 25 minutos. ¿Qué es lo que más te pesa ahora mismo?':'Thanks for telling me. Stress often shows up when it feels like there’s more to do than time. Let’s do something small: 1 minute of breathing, then pick a single task for a 25-minute pomodoro. What’s weighing on you most right now?',
'Te entiendo. La ansiedad muchas veces es la mente adelantándose a lo que podría pasar. Prueba esto: nombra 3 cosas que ves y 2 que escuchas a tu alrededor. Te ayuda a volver al presente. ¿Desde qué momento del día te sientes así?':'I understand. Anxiety is often the mind racing ahead to what might happen. Try this: name 3 things you see and 2 things you hear around you. It brings you back to the present. Since what time of day have you felt like this?',
'Está bien. Un día sin cumplir no borra tu progreso. Vamos a entender qué pasó: ¿fue cansancio, falta de tiempo o pocas ganas? Con eso ajustamos el hábito para mañana, quizá en una versión mini de 5 minutos.':'That’s okay. One missed day doesn’t erase your progress. Let’s understand what happened: was it tiredness, lack of time or low motivation? Then we’ll adjust the habit for tomorrow, maybe as a 5-minute mini version.',
'Pasa mucho, sobre todo con el celular cerca. Te propongo un pomodoro de 25 minutos con el teléfono en otra habitación y una sola tarea escrita en un papel. ¿Qué tarea elegirías?':'That happens a lot, especially with your phone nearby. Try a 25-minute pomodoro with your phone in another room and a single task written on paper. Which task would you pick?',
'Suena a que llevas tiempo dando más de lo que recuperas. Hoy la meta no es rendir más, es descansar mejor: elige lo esencial y deja lo demás para mañana. ¿Cuántas horas dormiste anoche?':'It sounds like you’ve been giving more than you recover for a while. Today the goal isn’t doing more, it’s resting better: pick the essentials and leave the rest for tomorrow. How many hours did you sleep last night?',

  function foldTex(base, line, lw, stars) {
    const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
    g.fillStyle = base; g.fillRect(0, 0, 256, 256); g.strokeStyle = line; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round';
    let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 30; i++) { g.beginPath(); let x = rnd() * 256, y = rnd() * 256; g.moveTo(x, y); for (let j = 0; j < 6; j++) { const cx = x + (rnd() - .5) * 80, cy = y + (rnd() - .5) * 80; x += (rnd() - .5) * 64; y += (rnd() - .5) * 64; g.quadraticCurveTo(cx, cy, x, y); } g.stroke(); }
    if (stars) for (let i = 0; i < 140; i++) { g.fillStyle = i % 5 ? 'rgba(255,255,255,.85)' : '#7DF3FF'; g.beginPath(); g.arc(rnd() * 256, rnd() * 256, rnd() * 1.8 + .4, 0, 7); g.fill(); }
    const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; return t;
  }
